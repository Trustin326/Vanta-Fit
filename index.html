<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VANTA FIT™ — Full Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .nav-actions button {
      margin-left: 12px;
      padding: 10px 20px;
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-actions button:hover {
      background: #ffffff;
      color: #000000;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 80px 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      margin-bottom: 20px;
    }

    p {
      color: #9a9a9a;
      font-size: 1.1rem;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 60px;
    }

    .img-box {
      height: 260px;
      border: 1px solid #222;
      background: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
    }

    .features {
      margin-top: 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .feature {
      border: 1px solid #222;
      background: #141414;
      padding: 24px;
    }

    .feature button {
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .feature button:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

<nav>
  <div class="brand">VANTA FIT™</div>
  <div class="nav-actions">
    <button onclick="demoBuyer()">Demo Buyer</button>
    <button onclick="demoOwner()">OWNER MODE</button>
  </div>
</nav>

<section class="container">
  <h1>Train Smarter.<br>Eat Cleaner.<br>Track Everything.</h1>
  <p>
    Live demo. No setup. Click OWNER MODE to unlock everything.
  </p>

  <!-- INLINE PLACEHOLDER IMAGES (ALWAYS SHOW) -->
  <div class="images">
    <div class="img-box">BEFORE</div>
    <div class="img-box">AFTER</div>
    <div class="img-box">MEALS</div>
    <div class="img-box">WORKOUTS</div>
    <div class="img-box">COACH CHAT</div>
  </div>

  <!-- FEATURE ACCESS -->
  <div class="features">
    <div class="feature">
      <h3>Dashboard</h3>
      <button onclick="go('dashboard.html')">Open</button>
    </div>
    <div class="feature">
      <h3>Meals</h3>
      <button onclick="go('meals.html')">Open</button>
    </div>
    <div class="feature">
      <h3>Workouts</h3>
      <button onclick="go('workouts.html')">Open</button>
    </div>
    <div class="feature">
      <h3>Progress</h3>
      <button onclick="go('progress.html')">Open</button>
    </div>
    <div class="feature">
      <h3>Coach Chat</h3>
      <button onclick="go('coach-chat.html')">Open</button>
    </div>
    <div class="feature">
      <h3>Analytics</h3>
      <button onclick="go('analytics.html')">Open</button>
    </div>
  </div>
</section>

<script>
/* BUYER DEMO */
function demoBuyer() {
  localStorage.setItem("vantaUser", "true");
  localStorage.setItem("vantaRole", "buyer");
  localStorage.setItem("vantaPlan", "pro");
  alert("Demo Buyer mode enabled");
}

/* OWNER FULL ACCESS */
function demoOwner() {
  localStorage.setItem("vantaUser", "true");
  localStorage.setItem("vantaRole", "owner");
  localStorage.setItem("vantaPlan", "elite");
  alert("OWNER MODE ENABLED — full access unlocked");
}

/* NAVIGATION */
function go(page) {
  window.location.href = page;
}
</script>

</body>
</html>
