<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanta-Fit™ — Luxury Fitness, Meals & Coaching</title>
  <meta name="description" content="Black & white luxury fitness app demo: landing, login, owner dashboard, meals, workouts, coach chat, progress, billing." />
  <meta name="theme-color" content="#0b0b0b" />
  <style>
    :root{
      --bg:#070707;
      --bg2:#0b0b0b;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.09);
      --stroke: rgba(255,255,255,.14);
      --text:#f4f4f4;
      --muted: rgba(244,244,244,.68);
      --muted2: rgba(244,244,244,.52);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --shadow2: 0 12px 30px rgba(0,0,0,.45);
      --radius: 18px;
      --radius2: 26px;
      --gold: #d8b04b;
      --ok: #3dff9f;
      --warn: #ffcc66;
      --bad: #ff5a7a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(216,176,75,.10), transparent 55%),
        radial-gradient(900px 500px at 85% 10%, rgba(255,255,255,.07), transparent 55%),
        radial-gradient(900px 600px at 40% 95%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      overflow-x:hidden;
    }
    a{ color:inherit; text-decoration:none; }
    button, input, select, textarea{ font:inherit; color:inherit; }
    .container{ width:min(1160px, 92vw); margin:0 auto; }
    .nav{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(14px);
      background: rgba(0,0,0,.45);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:14px; }
    .brand{
      display:flex; align-items:center; gap:12px;
      letter-spacing:.08em; text-transform:uppercase;
      font-weight:800; font-size:13px;
    }
    .mark{
      width:38px; height:38px; border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(216,176,75,.34), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      display:grid; place-items:center;
    }
    .mark svg{ opacity:.92; }
    .nav-links{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .pill{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      box-shadow: 0 10px 24px rgba(0,0,0,.20);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      cursor:pointer;
      user-select:none;
      font-weight:650;
      font-size:13px;
      letter-spacing:.01em;
    }
    .pill:hover{ transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.20); }
    .pill.primary{
      border-color: rgba(216,176,75,.45);
      background: rgba(216,176,75,.12);
    }
    .pill.ghost{ background: transparent; }
    .pill small{ color: var(--muted); font-weight:600; }
    .hero{
      padding: 78px 0 22px;
      position:relative;
    }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 26px;
      align-items: start;
    }
    @media (max-width: 980px){
      .hero-grid{ grid-template-columns: 1fr; }
    }
    .kicker{
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 12px; border-radius: 999px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      color: var(--muted);
      font-weight:650;
      font-size:12px;
      letter-spacing:.06em;
      text-transform:uppercase;
      margin-bottom: 16px;
    }
    .dot{
      width:8px; height:8px; border-radius:99px;
      background: var(--gold);
      box-shadow: 0 0 0 6px rgba(216,176,75,.10);
    }
    h1{
      font-size: clamp(2.1rem, 4.3vw, 3.6rem);
      line-height: 1.06;
      margin: 0 0 14px;
      letter-spacing: -.02em;
    }
    .lead{
      color: var(--muted);
      font-size: clamp(1.02rem, 1.3vw, 1.12rem);
      line-height: 1.65;
      margin: 0 0 22px;
    }
    .cta-row{ display:flex; gap:12px; flex-wrap:wrap; margin: 22px 0 14px; }
    .trust-row{
      display:flex; gap:16px; flex-wrap:wrap; align-items:center;
      color: var(--muted2); font-size:13px;
      margin-top: 14px;
    }
    .trust-chip{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
    }
    .hero-card{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(800px 420px at 20% 20%, rgba(216,176,75,.14), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      padding: 18px;
      position:relative;
      overflow:hidden;
    }
    .hero-card::after{
      content:"";
      position:absolute; inset:-40px -60px auto auto;
      width:220px; height:220px;
      background: radial-gradient(circle, rgba(216,176,75,.18), transparent 60%);
      transform: rotate(25deg);
      filter: blur(2px);
      pointer-events:none;
    }
    .mini{
      display:grid; gap: 12px;
    }
    .mini .row{
      display:grid; grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 520px){
      .mini .row{ grid-template-columns: 1fr; }
    }
    .stat{
      border-radius: var(--radius);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      padding: 14px;
      box-shadow: var(--shadow2);
    }
    .stat .t{ color: var(--muted2); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .stat .v{ font-size:22px; font-weight:800; margin-top:6px; letter-spacing:-.01em; }
    .stat .s{ color: var(--muted); font-size:13px; margin-top: 8px; line-height:1.45; }
    .divider{ height:1px; background: rgba(255,255,255,.10); margin: 26px 0; }
    .section{ padding: 30px 0; }
    .section h2{
      margin:0 0 10px;
      font-size: 28px;
      letter-spacing:-.01em;
    }
    .section p{ margin:0 0 18px; color: var(--muted); line-height:1.65; }
    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 980px){ .grid3{ grid-template-columns: 1fr; } }
    .card{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      padding: 16px;
      box-shadow: var(--shadow2);
    }
    .card h3{ margin: 8px 0 6px; }
    .muted{ color: var(--muted); }
    .tag{
      display:inline-flex; align-items:center; gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      font-size: 12px;
      letter-spacing:.04em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .tag b{ color: var(--text); font-weight:800; letter-spacing:.02em; text-transform:none; }
    .pricing{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 980px){ .pricing{ grid-template-columns: 1fr; } }
    .price-card{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(700px 420px at 10% 10%, rgba(255,255,255,.08), transparent 60%),
        rgba(255,255,255,.05);
      padding: 18px;
      box-shadow: var(--shadow2);
      position:relative;
      overflow:hidden;
    }
    .price-card.featured{
      border-color: rgba(216,176,75,.40);
      background:
        radial-gradient(700px 420px at 10% 10%, rgba(216,176,75,.16), transparent 60%),
        rgba(255,255,255,.05);
    }
    .price{
      font-size: 38px;
      font-weight: 900;
      letter-spacing:-.02em;
      margin: 10px 0 6px;
    }
    .price small{ font-size: 13px; color: var(--muted); font-weight:700; }
    ul.clean{ margin: 14px 0 0; padding:0; list-style:none; display:grid; gap:10px; }
    ul.clean li{ display:flex; gap:10px; color: var(--muted); line-height:1.45; }
    .check{
      width:18px; height:18px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.06);
      display:grid; place-items:center;
      margin-top:1px;
      flex: 0 0 auto;
    }
    .check svg{ opacity:.9; }
    .footer{ padding: 34px 0 44px; color: var(--muted2); font-size: 13px; }
    .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 980px){ .row2{ grid-template-columns: 1fr; } }

    /* APP SHELL */
    .app-wrap{ padding: 20px 0 48px; }
    .app-shell{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap: 14px;
      align-items:start;
    }
    @media (max-width: 980px){
      .app-shell{ grid-template-columns: 1fr; }
    }
    .side{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .side-top{
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
    }
    .who{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .who .name{ font-weight:900; letter-spacing:.01em; }
    .who .role{ color: var(--muted2); font-size: 12px; letter-spacing:.06em; text-transform:uppercase; }
    .side-nav{ padding: 10px; display:grid; gap:8px; }
    .navbtn{
      display:flex; align-items:center; gap:10px;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      cursor:pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      user-select:none;
      font-weight: 750;
      color: rgba(255,255,255,.90);
    }
    .navbtn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
    .navbtn.active{
      border-color: rgba(216,176,75,.40);
      background: rgba(216,176,75,.12);
    }
    .badge{
      margin-left:auto;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      padding: 5px 8px;
      border-radius: 999px;
    }
    .main{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow2);
      overflow:hidden;
      min-height: 560px;
    }
    .main-top{
      padding: 16px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
    }
    .main-top h2{ margin:0; font-size: 18px; letter-spacing:.02em; }
    .main-top .sub{ color: var(--muted2); font-size: 13px; }
    .main-body{ padding: 16px; }
    .panel{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }
    .panel + .panel{ margin-top: 12px; }
    .panel h3{ margin:0 0 10px; }
    .form{
      display:grid; gap: 10px;
    }
    .in{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      outline:none;
    }
    .in:focus{ border-color: rgba(216,176,75,.40); box-shadow: 0 0 0 6px rgba(216,176,75,.10); }
    .row{
      display:grid; grid-template-columns: 1fr 1fr; gap:10px;
    }
    @media (max-width: 780px){ .row{ grid-template-columns: 1fr; } }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      cursor:pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.20); }
    .btn.primary{
      border-color: rgba(216,176,75,.45);
      background: rgba(216,176,75,.12);
    }
    .btn.danger{
      border-color: rgba(255,90,122,.35);
      background: rgba(255,90,122,.12);
    }
    .note{
      color: var(--muted);
      font-size: 13px;
      line-height:1.55;
    }
    .toast{
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: min(420px, calc(100vw - 28px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.70);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      padding: 12px 12px;
      display:none;
      z-index: 99;
    }
    .toast .t{ font-weight: 900; }
    .toast .m{ color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.4; }
    .table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }
    .table th, .table td{
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align:left;
      font-size: 13px;
      color: rgba(255,255,255,.90);
    }
    .table th{ color: var(--muted); font-weight: 900; letter-spacing:.05em; text-transform:uppercase; font-size: 11px; }
    .table tr:last-child td{ border-bottom:none; }
    .pill2{
      display:inline-flex; align-items:center; gap:8px;
      padding: 6px 9px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
    }
    .pill2.ok{ border-color: rgba(61,255,159,.30); background: rgba(61,255,159,.10); color: rgba(244,244,244,.88); }
    .pill2.warn{ border-color: rgba(255,204,102,.30); background: rgba(255,204,102,.10); color: rgba(244,244,244,.88); }
    .pill2.bad{ border-color: rgba(255,90,122,.30); background: rgba(255,90,122,.10); color: rgba(244,244,244,.88); }
    .chatbox{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      padding: 12px;
      height: 320px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .bubble{
      max-width: 78%;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      padding: 10px 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }
    .bubble.me{
      margin-left:auto;
      border-color: rgba(216,176,75,.28);
      background: rgba(216,176,75,.10);
    }
    .bubble .meta{ color: var(--muted2); font-size: 11px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
    .bubble .txt{ color: rgba(255,255,255,.90); font-size: 13px; line-height:1.45; }
    .hr{ height:1px; background: rgba(255,255,255,.10); margin: 10px 0; }
    .kpi{
      display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    @media (max-width: 980px){ .kpi{ grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px){ .kpi{ grid-template-columns: 1fr; } }
    .kpi .box{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      padding: 12px;
    }
    .kpi .box .k{ color: var(--muted2); font-size: 11px; letter-spacing:.06em; text-transform:uppercase; }
    .kpi .box .v{ font-size: 20px; font-weight: 900; margin-top: 6px; }
    .kpi .box .d{ color: var(--muted); font-size: 12px; margin-top: 6px; line-height:1.35; }
    canvas{ width:100%; height: 190px; border-radius: 18px; border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.15); }
    .hide{ display:none !important; }

    /* login modal feel */
    .center{
      min-height: calc(100vh - 68px);
      display:grid;
      place-items:center;
      padding: 28px 0 44px;
    }
    .auth{
      width:min(980px, 92vw);
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 14px;
      align-items:stretch;
    }
    @media (max-width: 980px){
      .auth{ grid-template-columns: 1fr; }
    }
    .auth-left{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(700px 420px at 10% 10%, rgba(216,176,75,.14), transparent 60%),
        rgba(255,255,255,.05);
      padding: 18px;
      box-shadow: var(--shadow2);
    }
    .auth-right{
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      padding: 18px;
      box-shadow: var(--shadow2);
    }
    .auth-left h2{ margin: 0 0 8px; }
    .tiny{ color: var(--muted2); font-size: 12px; line-height: 1.6; }
    .kbd{
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.88);
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#/" id="brandLink" aria-label="Vanta-Fit Home">
        <span class="mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M8 21h8M12 3v18M6 7l6-4 6 4" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Vanta-Fit™</span>
      </a>

      <nav class="nav-links" id="topNav">
        <a class="pill ghost" href="#/pricing">Pricing</a>
        <a class="pill ghost" href="#/features">Features</a>
        <button class="pill" id="btnDemoLogin" type="button">Demo Login <small>(Buyer view)</small></button>
        <button class="pill primary" id="btnOwner" type="button">Owner Login</button>
      </nav>
    </div>
  </header>

  <!-- ROUTES -->
  <main id="routeRoot"></main>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <div class="t" id="toastTitle">Saved</div>
    <div class="m" id="toastMsg">Done.</div>
  </div>

<script>
/**
 * Vanta-Fit Single-File Fix
 * ✅ Landing always loads first at "#/"
 * ✅ Login lives at "#/login"
 * ✅ Owner app is "#/app" with ALL features unlocked
 * ✅ No redirect-to-login bug, no 404 routing, no broken paths
 *
 * Owner credentials (edit below if you want):
 *   Email: owner@vantafit.com
 *   Password: VantaFit!2026
 *
 * Buyer demo credentials:
 *   Email: demo@vantafit.com
 *   Password: demo1234
 */

const OWNER = { email:"owner@vantafit.com", pass:"VantaFit!2026", role:"owner", plan:"elite" };
const DEMO  = { email:"demo@vantafit.com",  pass:"demo1234",     role:"member", plan:"pro"  };

const LS = {
  session: "vf_session",
  user: "vf_user",
  role: "vf_role",
  plan: "vf_plan",
  ownerAll: "vf_owner_all",
  meals: "vf_meals_log",
  workouts: "vf_workouts_log",
  photos: "vf_photos",
  badges: "vf_badges",
  goals: "vf_goals",
  chat: "vf_chat",
  posts: "vf_posts"
};

const $ = (sel, el=document)=> el.querySelector(sel);
const $$ = (sel, el=document)=> Array.from(el.querySelectorAll(sel));
const routeRoot = $("#routeRoot");

function toast(title, msg){
  $("#toastTitle").textContent = title;
  $("#toastMsg").textContent = msg;
  const t = $("#toast");
  t.style.display = "block";
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=> t.style.display="none", 2800);
}

function nowHHMM(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}

function getSession(){
  const s = localStorage.getItem(LS.session);
  if(!s) return null;

function go(hash){ location.hash = hash; }

function requireAuth(){
  const sess = getSession();
  if(!sess){ go("#/login"); return null; }
  return sess;
}

function isOwner(){
  return localStorage.getItem(LS.role) === "owner" || localStorage.getItem(LS.ownerAll) === "1";
}

function quickLogin(which){
  ensureSeed();
  const who = which === "owner" ? OWNER : DEMO;
  localStorage.setItem(LS.user, who.email);
  localStorage.setItem(LS.role, who.role);
  localStorage.setItem(LS.plan, who.plan);
  if(who.role === "owner"){
    localStorage.setItem(LS.ownerAll, "1"); // OWNER SEES ALL FEATURES
  } else {
    localStorage.removeItem(LS.ownerAll);
  }
  setSession({ email: who.email, role: who.role, plan: who.plan, at: Date.now() });
  setTopNavForAuth();
  toast("Login successful", who.role === "owner" ? "Owner access: all features unlocked." : "Demo access: buyer view enabled.");
  go("#/app");
}

function drawChart(c){
  const ctx = c.getContext("2d");
  const w=c.width, h=c.height;
  ctx.clearRect(0,0,w,h);

  // background
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(0,0,w,h);

  // grid
  ctx.strokeStyle = "rgba(255,255,255,.10)";
  ctx.lineWidth = 1;
  for(let i=1;i<6;i++){
    const y = (h/6)*i;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  for(let i=1;i<8;i++){
    const x = (w/8)*i;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
  }

  // sample data (weight trend or body fat trend)
  const data = [168, 167.5, 167.2, 166.8, 166.1, 165.7, 165.4, 165.0];
  const min = Math.min(...data)-1;
  const max = Math.max(...data)+1;

  const padX=40, padY=26;
  function X(i){ return padX + (i*(w-padX*2)/(data.length-1)); }
  function Y(v){ return (h-padY) - ((v-min)*(h-padY*2)/(max-min)); }

  // line
  ctx.strokeStyle = "rgba(216,176,75,.92)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x=X(i), y=Y(v);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // points
  ctx.fillStyle = "rgba(244,244,244,.92)";
  data.forEach((v,i)=>{
    const x=X(i), y=Y(v);
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();
  });

  // labels
  ctx.fillStyle = "rgba(244,244,244,.82)";
  ctx.font = "700 12px ui-sans-serif, system-ui";
  ctx.fillText("Trend (demo)", 14, 18);
  ctx.fillStyle = "rgba(244,244,244,.55)";
  ctx.font = "600 11px ui-sans-serif, system-ui";
  ctx.fillText("Week 1", padX, h-8);
  ctx.fillText("Week 8", w-padX-46, h-8);
}

          <div class="note" style="margin-top:6px">${ownerOn ? "Every feature and tab is unlocked." : "Login as owner to unlock everything."}</div>
        </div>
        <div class="panel" style="background:rgba(255,255,255,.04)">
          <div class="tag"><b>Controls</b></div>
          <div style="height:10px"></div>
          <button class="btn primary" type="button" id="forceOn">Force Owner All On</button>
          <div style="height:10px"></div>
          <button class="btn danger" type="button" id="forceOff">Turn Override Off</button>
          <div class="note" style="margin-top:8px">Use this for demos or when testing buyer experience.</div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px">
      <h3>Coach Posts Editor</h3>
      <div class="note">These posts show on the Dashboard (and can be screenshotted for landing page).</div>
      <div class="divider"></div>

      ${posts.map((p,i)=>`
        <div class="panel" style="background:rgba(255,255,255,.04)">
          <div class="row">
            <input class="in" data-ptitle="${i}" value="${escapeAttr(p.title)}" />
            <input class="in" data-pdate="${i}" value="${escapeAttr(p.date)}" />
          </div>
          <div style="height:10px"></div>
          <textarea class="in" data-pbody="${i}" rows="3">${escapeHtml(p.body)}</textarea>
          <div style="height:10px"></div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn primary" type="button" data-savepost="${i}">Save Post</button>
            <button class="btn danger" type="button" data-delpost="${i}">Delete</button>
          </div>
        </div>
      `).join("")}

      <div class="divider"></div>

      <div class="panel" style="background:rgba(0,0,0,.18)">
        <h3>Add New Post</h3>
        <div class="row">
          <input class="in" id="newTitle" placeholder="Title" />
          <input class="in" id="newDate" placeholder="Date label (e.g., This week)" />
        </div>
        <div style="height:10px"></div>
        <textarea class="in" id="newBody" rows="3" placeholder="Post body..."></textarea>
        <div style="height:10px"></div>
        <button class="btn primary" id="addPost" type="button">Add Post</button>
      </div>
    </div>

    <div class="panel" style="margin-top:12px">
      <h3>Reset Demo Data</h3>
      <div class="note">If you want a fresh demo state for screenshots, use reset.</div>
      <div style="height:10px"></div>
      <button class="btn danger" type="button" id="resetAll">Reset All Local Data</button>
    </div>
  `;

  $("#forceOn").onclick = ()=>{
    localStorage.setItem(LS.ownerAll, "1");
    localStorage.setItem(LS.role, "owner");
    toast("Enabled","Owner override ON (all features visible).");
    renderAppPage("owner");
    setTopNavForAuth();
  };
  $("#forceOff").onclick = ()=>{
    localStorage.removeItem(LS.ownerAll);
    toast("Disabled","Owner override OFF.");
    renderAppPage("owner");
    setTopNavForAuth();
  };

  // save/delete posts
  $$("#pageBody button[data-savepost]").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.savepost;
      const arr = JSON.parse(localStorage.getItem(LS.posts) || "[]");
      arr[i].title = $(`[data-ptitle="${i}"]`).value;
      arr[i].date  = $(`[data-pdate="${i}"]`).value;
      arr[i].body  = $(`[data-pbody="${i}"]`).value;
      localStorage.setItem(LS.posts, JSON.stringify(arr));
      toast("Saved","Post updated.");
      renderAppPage("owner");
    };
  });
  $$("#pageBody button[data-delpost]").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.delpost;
      const arr = JSON.parse(localStorage.getItem(LS.posts) || "[]");
      arr.splice(i,1);
      localStorage.setItem(LS.posts, JSON.stringify(arr));
      toast("Deleted","Post removed.");
      renderAppPage("owner");
    };
  });

  $("#addPost").onclick = ()=>{
    const title = ($("#newTitle").value||"").trim();
    const date  = ($("#newDate").value||"").trim() || "Today";
    const body  = ($("#newBody").value||"").trim();
    if(!title || !body){ toast("Missing","Add a title and body."); return; }
    const arr = JSON.parse(localStorage.getItem(LS.posts) || "[]");
    arr.unshift({id:"p"+Math.random().toString(16).slice(2), title, date, body});
    localStorage.setItem(LS.posts, JSON.stringify(arr));
    toast("Added","New post created.");
    renderAppPage("owner");
  };

  $("#resetAll").onclick = ()=>{
    // preserve session? we'll clear everything.
    Object.values(LS).forEach(k=> localStorage.removeItem(k));
    toast("Reset","All local demo data cleared.");
    go("#/");
  };
}

function iconCheck(){
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <path d="M20 6L9 17l-5-5" stroke="rgba(255,255,255,.92)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function iconMini(page){
  const common = `stroke="rgba(255,255,255,.90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  if(page==="dashboard") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M4 13h7V4H4v9zm9 7h7V11h-7v9zM4 20h7v-5H4v5zm9-9h7V4h-7v7z"/></svg>`;
  if(page==="meals") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M8 3v8M12 3v8M16 3v8M6 11h12M7 21h10a2 2 0 0 0 2-2v-6H5v6a2 2 0 0 0 2 2z"/></svg>`;
  if(page==="workouts") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M6 9v6M18 9v6M3 10v4M21 10v4M8 12h8"/></svg>`;
  if(page==="coach") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8z"/></svg>`;
  if(page==="progress") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M4 19V5M4 19h16M7 15l4-4 3 3 5-7"/></svg>`;
  if(page==="store") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M6 6h15l-1.5 9h-12L6 6z"/><path ${common} d="M6 6l-2-2H2"/><path ${common} d="M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>`;
  if(page==="billing") return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M3 7h18v10H3V7z"/><path ${common} d="M3 10h18"/></svg>`;
  return `<svg width="18" height="18" viewBox="0 0 24 24"><path ${common} d="M12 1l3 5 6 .8-4.4 3.7 1.4 5.8L12 14.9 6 17.1l1.4-5.8L3 6.8 9 6l3-5z"/></svg>`;
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g, (m)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

function router(){
  const hash = (location.hash || "#/").replace(/^#/, "");
  const parts = hash.split("/").filter(Boolean); // e.g. ["app","meals"]
  const root = parts[0] || "";
  const sub = parts[1] || "";

  setTopNavForAuth();

  if(root === ""){
    layoutLanding();
    return;
  }
  if(root === "features"){
    layoutLanding("features");
    return;
  }
  if(root === "pricing"){
    layoutLanding("pricing");
    return;
  }
  if(root === "login"){
    layoutLogin();
    return;
  }
  if(root === "app"){
    layoutApp(sub);
    return;
  }

  // fallback to landing
  layoutLanding();
}

// NAV BUTTONS (top)
function wireTopButtons(){
  const demo = $("#btnDemoLogin");
  const owner = $("#btnOwner");
  if(demo) demo.onclick = ()=> quickLogin("demo");
  if(owner) owner.onclick = ()=> quickLogin("owner");
}

// Boot
window.addEventListener("hashchange", router);
window.addEventListener("load", ()=>{
  // If any old builds left a forced login flag, ignore it.
  // This single-file build never auto-redirects away from landing.
  setTopNavForAuth();
  wireTopButtons();
  router();
});
</script>
</body>
</html>
